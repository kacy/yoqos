name: ci

on:
  push:

# arch containers start with one mirror, and pacman gives up when it drops
# connections. these give it others to fall back to.
env:
  MIRRORLIST: |
    Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
    Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
    Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
    Server = https://mirrors.mit.edu/archlinux/$repo/os/$arch

# each job has a time limit about twice its usual length, so a step that
# hangs, like a stuck download, fails in minutes and can be run again.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build fmt
      - run: zig build test --summary all
      - name: the example configs load and pass yos's checks
        run: zig build && tests/examples.sh ./zig-out/bin/yos

  native:
    # debian trixie ships libalpm 15, the same as arch, and libsystemd.
    # the container has no running systemd, so the bus test skips.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils git libalpm-dev libarchive-dev libsystemd-dev
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test -Dalpm -Dsystemd --summary all

  arch:
    # real arch: its own libalpm and a real pacman database, as root.
    # no running systemd, so the bus test skips. privileged, so the btrfs
    # tests can loop-mount a scratch filesystem.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - run: printf %s "$MIRRORLIST" > /etc/pacman.d/mirrorlist && pacman -Syu --noconfirm --needed git libarchive systemd-libs btrfs-progs lowdown mandoc
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test -Dalpm -Dsystemd --summary all
      - run: zig build -Dalpm -Dsystemd -Doptimize=ReleaseSafe -Dcpu=baseline
      - name: init, lock, status, and plan against this machine
        run: tests/arch/smoke.sh ./zig-out/bin/yos
      - name: the example configs resolve against today's arch packages
        run: tests/examples.sh ./zig-out/bin/yos --resolve
      - name: the man pages render, and mandoc finds nothing wrong in them
        run: dist/man.sh man && mandoc -T lint -W unsupp man/*

  vm:
    # a booted arch vm under kvm: systemd running and a real bootloader.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [cloud, archinstall, ext4, limine, refind, sdboot, snapper]
        suite: [full]
        # a machine yoq os 0.1.5 set up, moved over to yos.
        include:
          - image: cloud
            suite: switch
    env:
      VM_IMAGE: ${{ matrix.image }}
      VM_SUITE: ${{ matrix.suite }}
    container:
      image: archlinux:latest
      options: --device /dev/kvm
    steps:
      - run: printf %s "$MIRRORLIST" > /etc/pacman.d/mirrorlist && pacman -Syu --noconfirm --needed git libarchive systemd-libs qemu-base edk2-ovmf libisoburn openssh swtpm socat
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dalpm -Dsystemd -Doptimize=ReleaseSafe -Dcpu=baseline
      # yoq os 0.1.5, the last release before the name was yos, built from
      # its tag.
      - if: matrix.suite == 'switch'
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --depth=1 origin tag v0.1.5
          mkdir -p /tmp/old/0.1.5
          git archive v0.1.5 | tar -x -C /tmp/old/0.1.5
          (cd /tmp/old/0.1.5 && zig build -Dalpm -Dsystemd -Doptimize=ReleaseSafe -Dcpu=baseline)
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # saved right after it's made, so a failing test doesn't mean
      # building the image again. the ssh key goes with it: the
      # archinstall image only lets that key in.
      - id: image
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/yos-vm/${{ matrix.image }}.qcow2
            ~/.cache/yos-vm/${{ matrix.image }}.vars
            ~/.cache/yos-vm/key
            ~/.cache/yos-vm/key.pub
          key: vm2-${{ matrix.image }}-${{ steps.week.outputs.week }}-${{ hashFiles('tests/vm/vm.sh', 'tests/vm/archinstall.json') }}
      - run: tests/vm/vm.sh image
      - if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/yos-vm/${{ matrix.image }}.qcow2
            ~/.cache/yos-vm/${{ matrix.image }}.vars
            ~/.cache/yos-vm/key
            ~/.cache/yos-vm/key.pub
          key: vm2-${{ matrix.image }}-${{ steps.week.outputs.week }}-${{ hashFiles('tests/vm/vm.sh', 'tests/vm/archinstall.json') }}
      - run: tests/vm/test.sh ./zig-out/bin/yos
      - if: failure()
        run: sed 's/\x1b\[[0-9;?=!]*[a-zA-Z]//g' ~/.cache/yos-vm/console.log | tail -n 800 || true

  iso:
    # yos's live iso, built with archiso, then booted in a vm with a
    # blank disk that it installs a machine on. privileged, since mkarchiso
    # mounts the root it builds.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
      options: --privileged --device /dev/kvm
    steps:
      - run: printf %s "$MIRRORLIST" > /etc/pacman.d/mirrorlist && pacman -Syu --noconfirm --needed git libarchive systemd-libs archiso qemu-base edk2-ovmf libisoburn lowdown openssh
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dalpm -Dsystemd -Doptimize=ReleaseSafe -Dcpu=baseline
      - run: dist/iso/build.sh ./zig-out/bin/yos out
      - run: tests/vm/iso.sh out/yos-*.iso
      - if: failure()
        run: sed 's/\x1b\[[0-9;?=!]*[a-zA-Z]//g' ~/.cache/yos-vm/console.log | tail -n 800 || true

  package:
    # the pkgbuild in dist/, built from this checkout and installed the way
    # a user would.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - run: printf %s "$MIRRORLIST" > /etc/pacman.d/mirrorlist && pacman -Syu --noconfirm --needed base-devel git zig lowdown
      - uses: actions/checkout@v4
        with:
          # pkgver counts commits.
          fetch-depth: 0
      - name: build and install the package
        run: |
          useradd -m builder
          install -d -o builder /home/builder/pkg
          install -m644 -o builder dist/PKGBUILD /home/builder/pkg/PKGBUILD
          git config --system --add safe.directory '*'
          su builder -c "cd ~/pkg && YOS_SOURCE=file://$GITHUB_WORKSPACE makepkg --noconfirm"
          pacman -U --noconfirm /home/builder/pkg/yos-git-*.pkg.tar.zst
          yos version
          test -f /usr/share/libalpm/hooks/yos-drift.hook
          test -f /usr/share/yos/profiles/omarchy.toml
          test -f /usr/share/man/man1/yos.1.gz && test -f /usr/share/man/man7/yos-generations.7.gz
          pacman -Qi yos-git
