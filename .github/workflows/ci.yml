name: ci

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build fmt
      - run: zig build test --summary all

  native:
    # debian trixie ships libalpm 15, the same as arch, and libsystemd.
    # the container has no running systemd, so the bus test skips.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils git libalpm-dev libarchive-dev libsystemd-dev
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test -Dalpm -Dsystemd --summary all

  arch:
    # real arch: its own libalpm and a real pacman database, as root.
    # no running systemd, so the bus test skips.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git libarchive systemd-libs
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test -Dalpm -Dsystemd --summary all
      - run: zig build -Dalpm -Dsystemd
      - name: init, lock, status, and plan against this machine
        run: tests/arch/smoke.sh ./zig-out/bin/os

  vm:
    # a booted arch vm under kvm: systemd running and a real bootloader.
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --device /dev/kvm
    steps:
      - run: pacman -Syu --noconfirm --needed git libarchive systemd-libs qemu-base edk2-ovmf libisoburn openssh
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dalpm -Dsystemd
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yoq-vm/base.qcow2
          key: arch-cloudimg-${{ steps.week.outputs.week }}
      - run: tests/vm/vm.sh image
      - run: tests/vm/test.sh ./zig-out/bin/os
      - if: failure()
        run: tail -n 60 ~/.cache/yoq-vm/console.log || true

  package:
    # the pkgbuild in dist/, built from this checkout and installed the way
    # a user would.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git zig
      - uses: actions/checkout@v4
      - name: build and install the package
        run: |
          useradd -m builder
          install -d -o builder /home/builder/pkg
          install -m644 -o builder dist/PKGBUILD /home/builder/pkg/PKGBUILD
          git config --system --add safe.directory '*'
          su builder -c "cd ~/pkg && YOQ_SOURCE=file://$GITHUB_WORKSPACE makepkg --noconfirm"
          pacman -U --noconfirm /home/builder/pkg/yoq-os-git-*.pkg.tar.zst
          os version
          test -f /usr/share/libalpm/hooks/yoq-drift.hook
          pacman -Qi yoq-os-git
