# a headless box in a closet: containers, file sync, a vpn to reach it
# from anywhere, and an ssh that only takes keys. the lts kernel means
# fewer reboots for kernel updates.
version = 1
packages = [
  "base", "linux-firmware", "grub", "efibootmgr", "btrfs-progs", "sudo",
  "docker-compose", "htop", "tmux", "rsync", "smartmontools",
]

[providers]
# arch has more than one package for these, and yos asks instead of picking
# the first one the way pacman does. naming them here means it never has to.
"libxtables.so" = "iptables"
initramfs = "mkinitcpio"

[system]
hostname = "closet"
timezone = "UTC"
locale = "en_US.UTF-8"

[boot]
kernel = "linux-lts"

[users.admin]
shell = "bash"
groups = ["wheel", "docker"]

[services]
ssh = true
docker = true
tailscale = true
firewalld = true
fstrim = true
resolved = true

# a service yos doesn't know by name: give its unit and package.
[services.syncthing]
unit = "syncthing@admin.service"
package = "syncthing"

[services.smartd]
unit = "smartd.service"
package = "smartmontools"

# a drop-in instead of editing sshd_config, which stays the package's.
[files."/etc/ssh/sshd_config.d/10-keys-only.conf"]
text = """
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
"""

# a backup job's credentials, kept out of the config.
[files."/etc/restic/env"]
secret = "restic/env"

[sysctl]
# docker and tailscale both route.
"net.ipv4.ip_forward" = 1
"net.ipv6.conf.all.forwarding" = 1
