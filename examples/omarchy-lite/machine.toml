# omarchy's desktop on yos: hyprland with omarchy's keybindings and look,
# and omarchy's own quickshell ui, its bar, panels, app launcher,
# notifications, lock screen, and ai agents panel. its apps, its own menu,
# and the packages only its repository has are left out. every package here
# comes from arch's own repositories, so `yos install` builds this from the
# live iso:
#
#   yos install https://example.com/you/machines.git --disk /dev/nvme0n1 --encrypt --update
#
# the shell isn't a package. shell/yos-shell fetches omarchy's repository at
# the commit shell/manifest pins, the first time a user logs in, and lays
# out the parts the manifest names; see the comments in both.
#
# the files next to this one are the machine's defaults, in /etc/xdg. a
# user's own in ~/.config wins over each of them.
version = 1
packages = [
  # the machine itself.
  "base", "linux-firmware", "grub", "efibootmgr", "btrfs-progs", "sudo",
  "man-db", "bash-completion", "wireless-regdb", "kernel-modules-hook",
  # the desktop: hyprland's own tools, fuzzel for the keybinding list and
  # the clipboard's history, and the background.
  "hyprsunset", "hyprpicker", "fuzzel", "swaybg", "uwsm",
  "xdg-desktop-portal-gtk", "qt6-wayland", "gnome-themes-extra",
  "gnome-keyring", "libsecret", "xdg-terminal-exec",
  # omarchy's shell, and what its plugins and commands run.
  "quickshell", "qt6-declarative", "git", "jq", "socat", "inotify-tools",
  "python", "python-gobject", "sqlite", "libnotify", "iw", "bluez-utils",
  "upower",
  # screenshots and the clipboard.
  "grim", "slurp", "satty", "wl-clipboard", "cliphist", "wtype",
  # hardware: brightness, media keys, disks, monitors over ddc.
  "brightnessctl", "playerctl", "pamixer", "udiskie", "ddcutil",
  # fonts.
  "ttf-jetbrains-mono-nerd", "noto-fonts", "noto-fonts-emoji",
  "noto-fonts-cjk", "woff2-font-awesome",
  # the terminal and what runs in it, as omarchy has it.
  "foot", "neovim", "lazygit", "btop", "fastfetch", "starship",
  "zoxide", "eza", "fzf", "ripgrep", "fd", "bat", "tldr", "plocate",
  "mise", "gum", "tmux", "bluetui", "wiremix", "lazydocker",
  # apps.
  "chromium", "nautilus", "sushi", "gvfs-mtp", "gvfs-smb", "imv", "mpv",
  "evince", "xournalpp",
  # docker, started on demand by its socket below.
  "docker-compose", "docker-buildx",
]

[providers]
# arch has more than one package for these, and yos asks instead of picking
# the first one the way pacman does. naming them here means it never has to.
"libxtables.so" = "iptables"
initramfs = "mkinitcpio"
jack = "pipewire-jack"

[system]
hostname = "atlas"
timezone = "America/Chicago"
locale = "en_US.UTF-8"
keymap = "us"

# omarchy encrypts the disk, and logs straight in once it's unlocked: the
# passphrase at boot is the only one. install with --encrypt for this.
[boot]
encrypt = true

# `yos init --new` on the machine fills these in from what it finds:
# [hardware]
# cpu = "amd"
# gpu = "amd"

[desktop]
session = "hyprland"
audio = "pipewire"
login = "sddm"
session_config = "hypr/hyprland.lua"

[users.kacy]
groups = ["wheel"]

[services]
networkmanager = true
resolved = true
timesyncd = true
bluetooth = true
cups = true
avahi = true
power-profiles = true
fstrim = true
# the bar's tailscale widget signs in, switches it on and off, and sends
# and receives files.
tailscale = true

# boot doesn't wait for the network to come up.
[services.wait-online]
unit = "NetworkManager-wait-online.service"
masked = true

# nothing in, everything out, with ufw, as omarchy has it. docker's
# containers may ask the host for dns. omarchy also opens localsend's port,
# but localsend isn't here.
[firewall]
backend = "ufw"
allow = [
  "53/udp from 172.16.0.0/12 to 172.17.0.1",
  "53/udp from 192.168.0.0/16 to 172.17.0.1",
]

# started when something first talks to it, rather than at every boot. the
# user isn't in the docker group, which would be root by another name; the
# docker cli runs under sudo.
[services.docker]
unit = "docker.socket"
package = "docker"

# kills one runaway app instead of letting memory pressure take the
# session down.
[services.oomd]
unit = "systemd-oomd.service"
package = "systemd"

# sddm logs the user in by itself, into hyprland under uwsm.
[files."/etc/sddm.conf.d/10-autologin.conf"]
text = """
[Autologin]
User=kacy
Session=hyprland-uwsm
"""

# ssh notices a dropped connection in a minute, not when tcp gives up.
[files."/etc/ssh/ssh_config.d/20-keepalive.conf"]
text = """
Host *
  ServerAliveInterval 15
  ServerAliveCountMax 3
  ConnectTimeout 10
"""

# mise's tools come before the system's, in the session and in login
# shells: its shims stand in for each tool it manages.
[files."/etc/profile.d/mise.sh"]
text = """
case ":$PATH:" in
*":$HOME/.local/share/mise/shims:"*) ;;
*) PATH="$HOME/.local/share/mise/shims:$PATH" ;;
esac
"""

# the session's own config, beside hyprland's.
[files."/etc/xdg/hypr/hyprsunset.conf"]
source = "hypr/hyprsunset.conf"

[files."/etc/xdg/fuzzel/fuzzel.ini"]
source = "fuzzel/fuzzel.ini"

[files."/etc/xdg/foot/foot.ini"]
source = "foot/foot.ini"

# omarchy's shell: the script that sets it up and runs it, and what it
# takes from omarchy.
[files."/etc/xdg/yos-shell/yos-shell"]
source = "shell/yos-shell"
mode = "0755"

[files."/etc/xdg/yos-shell/manifest"]
source = "shell/manifest"

[files."/etc/xdg/yos-shell/shell.json"]
source = "shell/shell.json"

[files."/etc/xdg/yos-shell/shortcuts"]
source = "shell/shortcuts"

[files."/etc/xdg/yos-shell/menu.jsonc"]
source = "shell/menu.jsonc"

# the shell's lock screen checks a password through this pam service, as
# omarchy's setup writes it.
[files."/etc/pam.d/omarchy-lock-password"]
text = """
#%PAM-1.0
auth       required                    pam_faillock.so preauth silent deny=10 unlock_time=120
-auth      [success=2 default=ignore]  pam_systemd_home.so
auth       [success=1 default=bad]     pam_unix.so try_first_pass nullok
auth       [default=die]               pam_faillock.so authfail deny=10 unlock_time=120
auth       optional                    pam_permit.so
auth       required                    pam_env.so
auth       required                    pam_faillock.so authsucc
account    include                     system-local-login
"""

# the keybinding list, which super + k and the menu open.
[files."/etc/xdg/hypr/scripts/menu-keybindings"]
source = "hypr/scripts/menu-keybindings"
mode = "0755"
