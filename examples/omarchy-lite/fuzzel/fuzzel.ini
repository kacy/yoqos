# the launcher, and the menus built on it, in tokyo night. from
# examples/omarchy-lite.
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=foot -e
launch-prefix=uwsm app --
prompt="  "
icons-enabled=yes
width=40
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8

[colors]
background=1a1b26f2
text=a9b1d6ff
prompt=7aa2f7ff
input=c0caf5ff
match=7aa2f7ff
selection=292e42ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=0
