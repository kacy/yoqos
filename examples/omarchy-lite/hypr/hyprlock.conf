# the lock screen, in tokyo night. from examples/omarchy-lite.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
}

label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 600, 80
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 3
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(24283bff)
    font_color = rgba(c0caf5ff)
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = enter password
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}
