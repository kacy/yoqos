# when the machine is left alone: the screen locks after five minutes, and
# goes dark a little after. from examples/omarchy-lite.

general {
    lock_cmd = pidof hyprlock || hyprlock -c /etc/xdg/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
